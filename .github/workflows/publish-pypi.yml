name: Publish Python 🐍 distribution 📦 to PyPI

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build distribution 📦
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read # reading this run's own artifact list, below

    steps:
      # A recovery re-run — the one the signing fallback in `github-release`
      # prescribes — must attach and sign the exact bytes attempt 1 published,
      # because PyPI's copies of them are immutable. Rebuilding cannot promise
      # that: `[build-system] requires = ["hatchling"]` names no version, so a
      # hatchling release landing between two attempts changes the output of the
      # same commit, and GitHub would then serve — and Sigstore would attest —
      # dists that differ from the ones on PyPI. Artifacts are scoped to the run
      # rather than to the attempt, so the build attempt 1 stored is still here;
      # reuse it and skip the rest of this job.
      - name: Look for a build stored by an earlier attempt
        id: earlier_build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STATE=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '[.artifacts[] | select(.name == "python-package-distributions")]
                  | if length == 0 then "absent"
                    elif any(.expired) then "expired"
                    else "present" end')
          case "$STATE" in
            present)
              echo "An earlier attempt stored a build — reusing it."
              echo "reuse=true" >> "$GITHUB_OUTPUT"
              ;;
            expired)
              echo "::error::The build stored by an earlier attempt has expired, so this run can no longer reproduce the dists it published. Publish a new version instead of re-running this one."
              exit 1
              ;;
            *)
              echo "reuse=false" >> "$GITHUB_OUTPUT"
              ;;
          esac
      - uses: actions/checkout@v4
        if: steps.earlier_build.outputs.reuse != 'true'
        with:
          persist-credentials: false
      - name: Set up Python
        if: steps.earlier_build.outputs.reuse != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install pypa/build
        if: steps.earlier_build.outputs.reuse != 'true'
        run: >-
          python3 -m
          pip install
          build
          --user
      - name: Build a binary wheel and a source tarball
        if: steps.earlier_build.outputs.reuse != 'true'
        run: python3 -m build
      # Deliberately no `overwrite`: artifacts are immutable in v4, and the guard
      # above means this step is reached only when the run holds no build yet. A
      # second attempt reuses the first one's bytes rather than replacing them.
      - name: Store the distribution packages
        if: steps.earlier_build.outputs.reuse != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    name: >-
      Publish Python 🐍 distribution 📦 to PyPI
    needs:
      - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/kajson
    permissions:
      id-token: write # IMPORTANT: mandatory for trusted publishing

    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish distribution 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Only a re-run may skip an already-published version, which is what the
          # signing fallback below tells the operator to do: PyPI files are immutable,
          # so on a second attempt this step would otherwise die on the already-published
          # version and `github-release` — which needs this job — would never get to
          # attach the missing signatures.
          #
          # On a first attempt it stays off deliberately. version-check.yml runs on
          # `pull_request` only, so nothing guards a direct push to `main` that keeps the
          # current version. Letting that publish "successfully" would carry it into
          # `github-release`, which would `--clobber` the tagged release's dists with a
          # build of the newer commit while PyPI kept serving the originals. Failing here
          # is what keeps that release intact.
          skip-existing: ${{ github.run_attempt > 1 }}

  github-release:
    name: >-
      Sign the Python 🐍 distribution 📦 with Sigstore
      and upload them to GitHub Release
    needs:
      - build
      - publish-to-pypi
    runs-on: ubuntu-latest

    permissions:
      contents: write # IMPORTANT: mandatory for making GitHub Releases
      id-token: write # IMPORTANT: mandatory for sigstore

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Extract version from pyproject.toml
        id: get_version
        run: |
          VERSION=$(grep -m 1 'version = ' pyproject.toml | cut -d '"' -f 2)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      # `skip-existing` above is gated on `github.run_attempt > 1`, which separates a
      # first attempt from a re-run but not a legitimate recovery from a re-run of an
      # attempt that failed *because* an earlier commit had already published this
      # version. In that second case skipping turns PyPI's duplicate rejection into
      # success and carries the run down here, where `--clobber` would replace the
      # tagged release's dists with this commit's build while PyPI kept serving the
      # originals. The tag settles which case this is: it exists only once a release
      # has shipped this version, and it names the commit that shipped it. Absent
      # (attempt 1 died between the PyPI upload and `gh release create`) is allowed;
      # pointing elsewhere is not. Uses the commits endpoint so an annotated tag
      # resolves to its commit rather than to the tag object.
      - name: Refuse to touch a release that shipped a different commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          TAGGED_SHA=$(gh api "repos/$GITHUB_REPOSITORY/commits/v$VERSION" --jq '.sha' 2>/dev/null || true)
          # A missing tag is a 422 whose body `gh` writes to stdout, so treat anything
          # that is not a commit sha as "no such tag" rather than as a mismatch.
          if [[ ! "$TAGGED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            TAGGED_SHA=""
          fi
          if [ -n "$TAGGED_SHA" ] && [ "$TAGGED_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::v$VERSION is already tagged at $TAGGED_SHA, but this run is building $GITHUB_SHA. Refusing to replace that release's artifacts with a different commit's build. Bump the version instead of re-running this workflow."
            exit 1
          fi
      - name: Extract changelog notes for current version
        id: get_changelog
        run: |
          VERSION=${{ env.VERSION }}
          echo "Extracting changelog for version v$VERSION"
          
          # Find the start of the current version section
          START_LINE=$(grep -n "## \[v$VERSION\] - " CHANGELOG.md | cut -d: -f1)
          
          if [ -z "$START_LINE" ]; then
            echo "Warning: No changelog entry found for version v$VERSION"
            echo "CHANGELOG_NOTES=" >> $GITHUB_ENV
            exit 0
          fi
          
          # Find the start of the next version section (previous version)
          NEXT_VERSION_LINE=$(tail -n +$((START_LINE + 1)) CHANGELOG.md | grep -n "^## \[v.*\] - " | head -1 | cut -d: -f1)
          
          if [ -z "$NEXT_VERSION_LINE" ]; then
            # No next version found, extract from current version till end of file
            CHANGELOG_CONTENT=$(tail -n +$START_LINE CHANGELOG.md)
          else
            # Extract content from current version header to before next version
            END_LINE=$((START_LINE + NEXT_VERSION_LINE - 1))
            CHANGELOG_CONTENT=$(sed -n "$START_LINE,$((END_LINE - 1))p" CHANGELOG.md)
          fi
          
          # Clean up the content but preserve the blank line after the header
          # First, get the header line and add a blank line after it
          HEADER_LINE=$(echo "$CHANGELOG_CONTENT" | head -1)
          CONTENT_LINES=$(echo "$CHANGELOG_CONTENT" | tail -n +2 | sed '/^$/d' | sed 's/^[[:space:]]*//' | sed 's/[[:space:]]*$//')
          
          # Combine header + blank line + content
          CHANGELOG_CONTENT=$(printf "%s\n\n%s" "$HEADER_LINE" "$CONTENT_LINES")
          
          # Escape for GitHub Actions
          echo "CHANGELOG_NOTES<<EOF" >> $GITHUB_ENV
          echo "$CHANGELOG_CONTENT" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
      - name: Download all the dists
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      # Ordering is deliberate: the release is created BEFORE the dists are signed,
      # and signing is allowed to fail. The tag exists only as a side effect of
      # `gh release create`, so while signing sat ahead of this step a Sigstore
      # outage cost us the GitHub Release *and* the tag — the pinned action died on
      # a refreshed trust root ("root was signed by 0/3 keys") after the package had
      # already reached PyPI. Attestation is a nice-to-have; the tag is the record
      # of what shipped.
      - name: Create or update the GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$CHANGELOG_NOTES" ]; then
            NOTES="$CHANGELOG_NOTES"
          else
            NOTES="Release v$VERSION"
          fi

          # `create` fails outright when the release already exists, which would make
          # a re-run after a signing failure unusable precisely when it is needed.
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists — updating it."
            gh release edit "v$VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --title "v$VERSION" \
              --notes "$NOTES"
          else
            gh release create "v$VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --title "v$VERSION" \
              --notes "$NOTES"
          fi
      # Attach the artifacts straight away, so a signing failure cannot leave the
      # release standing empty next to a populated PyPI page.
      - name: Upload the dists to GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          gh release upload
          "v$VERSION" dist/*.whl dist/*.tar.gz
          --repo "$GITHUB_REPOSITORY"
          --clobber
      - name: Sign the dists with Sigstore
        id: sign
        # A Sigstore trust-root refresh is outside our control and must not fail a
        # release that has already published. The signatures are uploaded below only
        # when this succeeds, and a skipped signing is reported as a warning.
        continue-on-error: true
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: >-
            ./dist/*.tar.gz
            ./dist/*.whl
      - name: Upload artifact signatures to GitHub Release
        if: steps.sign.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # Only the bundles signing just produced (`{input}.sigstore.json`). A
        # `dist/**` glob would also match the wheel and sdist attached above, and
        # `--clobber` deletes an asset before uploading its replacement — so a
        # transient failure here would strip the release of the very dists the
        # previous step exists to secure.
        run: >-
          gh release upload
          "v$VERSION" dist/*.sigstore.json
          --repo "$GITHUB_REPOSITORY"
          --clobber
      - name: Report an unsigned release
        if: steps.sign.outcome != 'success'
        run: >-
          echo "::warning::Sigstore signing failed. v$VERSION is released and its
          dists are attached, but it carries no signature bundles. Once Sigstore is
          healthy, use 'Re-run all jobs' on this run to attach them — signing is
          non-fatal, so this job succeeded and 'Re-run failed jobs' is not offered."
